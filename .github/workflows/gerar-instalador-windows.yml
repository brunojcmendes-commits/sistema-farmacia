name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "sistfarma-1.4.0-dashboard"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  servidor:
    name: Empacotar extensao SISCOFIS Ubuntu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Gerar atualizacao offline do servidor
        run: python3 server/build_deb.py dist/Servidor_Farmacia_Conferencia_SISCOFIS_1.4.3_all.deb
      - name: Validar scripts do pacote
        run: |
          dpkg-deb --info dist/Servidor_Farmacia_Conferencia_SISCOFIS_1.4.3_all.deb
          dpkg-deb --control dist/Servidor_Farmacia_Conferencia_SISCOFIS_1.4.3_all.deb /tmp/siscofis-control
          sh -n /tmp/siscofis-control/preinst /tmp/siscofis-control/postinst /tmp/siscofis-control/prerm
      - uses: actions/upload-artifact@v4
        with:
          name: Servidor-Farmacia-SISCOFIS-1.4.3
          path: dist/Servidor_Farmacia_Conferencia_SISCOFIS_1.4.3_all.deb
          if-no-files-found: error
          retention-days: 30
  compilar:
    name: Compilar Sistema Farmacia
    runs-on: windows-2022

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Testar calculos e ponte local
        shell: powershell
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes Python." }
          node tests/test_dashboard.mjs
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes do painel." }

      - name: Instalar o compilador dos aplicativos
        shell: powershell
        run: python -m pip install "pyinstaller>=6,<7"

      - name: Compilar Gerente e Cliente Farmacia
        shell: powershell
        run: |
          Push-Location "windows/src"
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "Gerente_Farmacia" `
            --icon "Gerente_Farmacia.ico" `
            --add-data "Gerente_Farmacia.png;." `
            --add-data "../web;web" `
            gestor_html.py
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "Cliente_Farmacia" `
            --icon "Cliente_Farmacia.ico" `
            --add-data "Cliente_Farmacia.png;." `
            --add-data "../web;web" `
            cliente_html.py
          Pop-Location

      - name: Preparar arquivos do instalador
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "windows/installer/Arquivos_do_Programa" | Out-Null
          Copy-Item "windows/src/dist/Gerente_Farmacia.exe" "windows/installer/Arquivos_do_Programa/"
          Copy-Item "windows/src/dist/Cliente_Farmacia.exe" "windows/installer/Arquivos_do_Programa/"
          Copy-Item "windows/src/Gerente_Farmacia.ico" "windows/installer/Arquivos_do_Programa/"
          Copy-Item "windows/src/Cliente_Farmacia.ico" "windows/installer/Arquivos_do_Programa/"

      - name: Testar executaveis empacotados
        shell: powershell
        run: python tests/smoke_frozen.py windows/installer/Arquivos_do_Programa

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Gerar Setup profissional
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Compilador Inno Setup nao encontrado." }
          & $iscc "windows/installer/Sistema_Farmacia_Setup.iss"

      - name: Publicar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Farmacia-Windows-1.4.3
          path: windows/installer/Saida/Sistema_Farmacia_Setup_1.4.3.exe
          if-no-files-found: error
          retention-days: 30
